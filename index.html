<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIPLA+ | Bölüm Bazlı Platform Macerası</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        color: #fff;
    }
    #gameContainer {
        position: relative;
        width: 800px;
        max-width: 95vw;
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #333;
        background: #000;
    }
    canvas { display: block; width: 100%; background: #000; }
    
    .hidden { display: none !important; }

    /* --- MENÜLER VE OVERLAYLER --- */
    .menu-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 200; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white;
        backdrop-filter: blur(10px);
    }
    #mainMenu { 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        animation: gradientShift 15s ease infinite;
        background-size: 400% 400%;
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    #levelSelectMenu { background: rgba(44, 62, 80, 0.95); overflow-y: auto; padding: 40px 20px; }
    #levelCompleteOverlay { background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); }

    .game-title {
        font-size: 72px;
        font-weight: 900;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 8px;
        background: linear-gradient(45deg, #fff, #a8edea, #fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(255,255,255,0.3);
        animation: titleGlow 3s ease-in-out infinite alternate;
        position: relative;
    }
    @keyframes titleGlow {
        from { text-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 40px rgba(102, 126, 234, 0.5); }
        to { text-shadow: 0 0 40px rgba(255,255,255,0.6), 0 0 80px rgba(118, 75, 162, 0.8); }
    }
    .game-subtitle {
        font-size: 18px;
        margin-bottom: 50px;
        opacity: 0.9;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.8);
        font-weight: 300;
    }

    .menu-btn {
        padding: 16px 50px;
        font-size: 18px;
        font-weight: 700;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        margin-bottom: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .menu-btn::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.5s;
    }
    .menu-btn:hover::before { left: 100%; }
    .menu-btn:hover { transform: translateY(-3px) scale(1.05); }
    .menu-btn:active { transform: translateY(-1px) scale(1.02); }
    
    .btn-green { 
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        box-shadow: 0 8px 25px rgba(46, 204, 113, 0.5);
    }
    .btn-green:hover { box-shadow: 0 12px 35px rgba(46, 204, 113, 0.7); }
    
    .btn-blue { 
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        box-shadow: 0 8px 25px rgba(52, 152, 219, 0.5);
    }
    .btn-blue:hover { box-shadow: 0 12px 35px rgba(52, 152, 219, 0.7); }
    
    .btn-red { 
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        box-shadow: 0 8px 25px rgba(231, 76, 60, 0.5);
        opacity: 0.9;
        font-size: 14px;
        padding: 12px 30px;
    }
    .btn-red:hover { opacity: 1; box-shadow: 0 12px 35px rgba(231, 76, 60, 0.7); }
    
    .btn-gray { 
        background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        position: absolute;
        top: 30px;
        left: 30px;
        padding: 12px 25px;
        font-size: 14px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .btn-gray:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    .stats-container {
        margin-top: 40px;
        padding: 20px 40px;
        background: rgba(255,255,255,0.1);
        border-radius: 50px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2);
        font-size: 16px;
        letter-spacing: 1px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    .stats-container span {
        color: #f1c40f;
        font-weight: 700;
        font-size: 18px;
    }

    /* --- BÖLÜM HARİTASI --- */
    #levelGrid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 25px;
        max-width: 650px;
        margin-top: 30px;
    }
    .level-btn {
        width: 90px; height: 90px; border-radius: 50%;
        border: 4px solid #7f8c8d; background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
        color: white; font-size: 28px; font-weight: 700;
        cursor: pointer; position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .level-btn.unlocked { 
        background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        border-color: #2ecc71;
        box-shadow: 0 8px 25px rgba(46, 204, 113, 0.5);
    }
    .level-btn.unlocked:hover { 
        transform: scale(1.15) translateY(-5px);
        box-shadow: 0 12px 35px rgba(46, 204, 113, 0.7);
    }
    .level-btn.locked { 
        background: linear-gradient(135deg, #7f8c8d 0%, #95a5a6 100%);
        cursor: not-allowed; 
        opacity: 0.6;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .level-btn.current { 
        animation: pulse 1.5s infinite;
        border-color: #fff;
        box-shadow: 0 0 30px rgba(46, 204, 113, 0.8);
    }
    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7), 0 0 0 0 rgba(255,255,255,0.5); }
        50% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0), 0 0 0 10px rgba(255,255,255,0); }
    }
    .level-stars { 
        position: absolute; 
        bottom: -30px; 
        font-size: 14px; 
        color: #f1c40f; 
        white-space: nowrap;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        font-weight: 600;
    }
</style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- ANA MENÜ -->
    <div id="mainMenu" class="menu-overlay">
        <h1 class="game-title">ZIPLA+</h1>
        <p class="game-subtitle">Bölüm Bazlı Platform Macerası</p>
        <button id="playBtn" class="menu-btn btn-green">OYUNA BAŞLA</button>
        <button id="levelSelectBtn" class="menu-btn btn-blue">BÖLÜMLER</button>
        <button id="resetProgressBtn" class="menu-btn btn-red">İLERLEMENİ SIFIRLA</button>
        <div class="stats-container">
            Toplam Yıldız: <span id="totalStarsDisplay">0</span> / <span id="maxStarsDisplay">0</span> ⭐
        </div>
    </div>

    <!-- BÖLÜM HARİTASI -->
    <div id="levelSelectMenu" class="menu-overlay hidden">
        <h2 style="font-size: 42px; margin-bottom: 30px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;">BÖLÜM SEÇ</h2>
        <button id="backToMenuBtn" class="menu-btn btn-gray">← ANA MENÜ</button>
        <div id="levelGrid"></div>
    </div>

    <!-- BÖLÜM SONU EKRANI -->
    <div id="levelCompleteOverlay" class="menu-overlay hidden">
        <h2 style="color: #2ecc71; font-size: 48px; margin-bottom: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 30px rgba(46, 204, 113, 0.5);">BÖLÜM TAMAMLANDI!</h2>
        <p id="completionLevelName" style="font-size: 28px; margin-bottom: 8px; font-weight: 600;">Bölüm Adı</p>
        <p style="font-size: 18px; color: #95a5a6; margin-bottom: 25px;">Dünya: <span id="completionWorldName" style="color: #3498db; font-weight: 600;">Çimenlik</span></p>
        <div style="font-size: 56px; margin-bottom: 25px;" id="completionStars">⭐⭐⭐</div>
        <p style="font-size: 20px; margin-bottom: 12px;">Süre: <span id="completionTime" style="color: #f1c40f; font-weight: 700; font-size: 24px;">0.00 sn</span></p>
        <p style="font-size: 18px; margin-bottom: 40px;">Altınlar: <span id="completionCoins" style="color: #f1c40f; font-weight: 600; font-size: 22px;">0 / 0</span></p>
        <div style="display: flex; gap: 20px;">
            <button id="nextLevelBtn" class="menu-btn btn-green">SONRAKİ BÖLÜM ➔</button>
            <button id="backToMapBtn" class="menu-btn btn-blue">HARİTAYA DÖN</button>
        </div>
    </div>
</div>

    <!-- Game Modules - Load order matters -->
    <script type="module" src="js/worlds.js"></script>
    <script type="module" src="js/levels.js"></script>
    <script type="module" src="js/audio.js"></script>
    <script type="module" src="js/saveSystem.js"></script>
    <script type="module" src="js/game.js"></script>
    <script type="module" src="js/update.js"></script>
    <script type="module" src="js/draw.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
